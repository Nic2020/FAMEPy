name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      FAMEPY_REQUIRE_SHIM: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pre-commit run --all-files
      - name: Build independent C shim
        run: uv run python scripts/build_test_shim.py
      - name: Configure Linux shim
        if: runner.os == 'Linux'
        shell: bash
        run: echo "FAMEPY_TEST_SHIM=$GITHUB_WORKSPACE/build/test-shim/libfamepy_test.so" >> "$GITHUB_ENV"
      - name: Configure Windows shim
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "FAMEPY_TEST_SHIM=$env:GITHUB_WORKSPACE/build/test-shim/famepy_test.dll"
      - run: uv run pytest -q
      - name: Installed wheel and rebuilt sdist tests
        run: uv run python scripts/verify_artifacts.py
  numpy-floor:
    # Minimum-compatible NumPy on a Python version that NumPy 1.26 supports.
    # Python 3.13 keeps its locked NumPy; no incompatible wheel is forced there.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      FAMEPY_REQUIRE_SHIM: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv pip install --python .venv/bin/python "numpy==1.26.*"
      - run: uv run --no-sync python -c "import numpy; assert numpy.__version__.startswith('1.26'), numpy.__version__"
      - run: uv run --no-sync python scripts/build_test_shim.py
      - run: echo "FAMEPY_TEST_SHIM=$GITHUB_WORKSPACE/build/test-shim/libfamepy_test.so" >> "$GITHUB_ENV"
      - run: uv run --no-sync pytest -q
