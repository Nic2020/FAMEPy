[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "FAMEPy"
version = "0.0.3.dev0"
description = "Python bindings and time-series integration for the FAME CHLI library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["TimeSeriesEconPy>=0.0.1.dev3", "numpy>=1.26"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Nic2020/FAMEPy"
Issues = "https://github.com/Nic2020/FAMEPy/issues"

[project.scripts]
famepy = "famepy.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.19", "build>=1.2", "hatchling>=1.27", "pre-commit>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/famepy"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/licenses", "/LICENSE", "/README.md", "/SECURITY.md", "/CONTRIBUTING.md", "/pyproject.toml", "/uv.lock", "/.pre-commit-config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
markers = ["native_shim: requires a locally compiled independent test library"]
filterwarnings = ["error::UserWarning", "error::RuntimeWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No python_version pin: each CI interpreter checks against its own NumPy stubs.
strict = true
files = ["src/famepy"]
