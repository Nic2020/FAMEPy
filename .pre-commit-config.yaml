repos:
  - repo: local
    hooks:
      - id: public-files
        name: public text hygiene and privacy patterns
        entry: python scripts/check_public.py
        language: system
        types: [text]
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
